name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/VolumeBridge.Tests -c Release
      - run: dotnet publish src/VolumeBridge -c Release -r win-x64 -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBridge-win-x64
          path: out/VolumeBridge.exe
