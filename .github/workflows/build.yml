name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # create releases on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/VolumeBridge/VolumeBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$v</Version> in VolumeBridge.csproj"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build APO
        shell: pwsh
        run: |
          # Headers/libs for APOs live in the Windows SDK (um); fail with a clear message if not found.
          $h = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter BaseAudioProcessingObject.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $l = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Recurse -Filter AudioBaseProcessingObjectV140.lib -ErrorAction SilentlyContinue | Where-Object FullName -like '*x64*' | Select-Object -First 1
          "header: $($h.FullName)"; "lib: $($l.FullName)"
          if (-not $h -or -not $l) { throw "APO SDK files not found" }
          $env:INCLUDE = "$($h.DirectoryName);$env:INCLUDE"
          $env:LIB = "$($l.DirectoryName);$env:LIB"
          ./apo/build.ps1 -Out "$PWD\out"
          $deps = dumpbin /nologo /dependents out\VolumeBridgeApo.dll | Out-String
          $exps = dumpbin /nologo /exports out\VolumeBridgeApo.dll | Out-String
          $deps; $exps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "APO must not depend on the VC++ runtime" }
          foreach ($e in 'DllCanUnloadNow','DllGetClassObject','DllRegisterServer','DllUnregisterServer') {
            if ($exps -notmatch $e) { throw "APO export $e missing" }
          }

      - run: dotnet test tests/VolumeBridge.Tests -c Release

      - name: Build single exe
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          dotnet build src/VolumeBridge -c Release "-p:ApoDll=$PWD\out\VolumeBridgeApo.dll" -p:RequireApo=true -o dist
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
          $files = @(Get-ChildItem -Force dist)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'VolumeBridge.exe') {
            $names = ($files | ForEach-Object Name) -join ', '
            throw "dist must contain only VolumeBridge.exe, found: $names"
          }
          $size = $files[0].Length
          "VolumeBridge.exe size: $size bytes ($([math]::Round($size / 1KB, 1)) KB / $([math]::Round($size / 1MB, 2)) MB)"
          if ($size -gt 5MB) {
            throw "VolumeBridge.exe is $size bytes, exceeding the 5 MB limit"
          }
          $h = (Get-FileHash dist\VolumeBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  VolumeBridge.exe" | Set-Content -NoNewline -Encoding ascii dist\VolumeBridge.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBridge
          path: |
            dist/VolumeBridge.exe
            dist/VolumeBridge.exe.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/VolumeBridge.exe dist/VolumeBridge.exe.sha256 `
            --title "VolumeBridge $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
