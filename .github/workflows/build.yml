name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  USBIP_VERSION: 0.9.8.1
  USBIP_SHA256: 38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/VolumeBridge.Tests -c Release
      - run: dotnet publish src/VolumeBridge -c Release -r win-x64 -o out

      - name: Download usbip-win2 (pinned, hash-checked)
        shell: pwsh
        run: |
          $name = "USBip-$env:USBIP_VERSION-x64.exe"
          Invoke-WebRequest "https://github.com/vadimgrn/usbip-win2/releases/download/v.$env:USBIP_VERSION/$name" -OutFile "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:USBIP_SHA256) { throw "usbip-win2 hash mismatch: $hash" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DPayloadDir=$PWD\out" "/O$PWD\installer\output" installer\VolumeBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBridgeSetup
          path: installer/output/VolumeBridgeSetup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBridge-win-x64
          path: out/VolumeBridge.exe
          if-no-files-found: error
