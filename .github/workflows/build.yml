name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # create releases on version tags

env:
  USBIP_VERSION: 0.9.8.1
  USBIP_SHA256: 38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/VolumeBridge/VolumeBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$v</Version> in VolumeBridge.csproj"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: dotnet test tests/VolumeBridge.Tests -c Release
      - run: dotnet publish src/VolumeBridge -c Release -r win-x64 -o out

      - name: Download usbip-win2 (pinned, hash-checked)
        shell: pwsh
        run: |
          $name = "USBip-$env:USBIP_VERSION-x64.exe"
          Invoke-WebRequest "https://github.com/vadimgrn/usbip-win2/releases/download/v.$env:USBIP_VERSION/$name" -OutFile "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:USBIP_SHA256) { throw "usbip-win2 hash mismatch: $hash" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DPayloadDir=$PWD\out" "/O$PWD\installer\output" installer\VolumeBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $h = (Get-FileHash installer\output\VolumeBridgeSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  VolumeBridgeSetup.exe" | Set-Content -NoNewline -Encoding ascii installer\output\VolumeBridgeSetup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBridgeSetup
          path: |
            installer/output/VolumeBridgeSetup.exe
            installer/output/VolumeBridgeSetup.exe.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME installer/output/VolumeBridgeSetup.exe installer/output/VolumeBridgeSetup.exe.sha256 `
            --title "VolumeBridge $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
